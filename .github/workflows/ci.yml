name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: Router (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: router/go.mod
          cache-dependency-path: router/go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker (compose + images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          cp config/providers.example.yaml config/providers.yaml
          docker compose config -q
          docker compose --profile autoupdate --profile tunnel --profile ollama config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build router image
        uses: docker/build-push-action@v6
        with:
          context: router
          push: false
          cache-from: type=gha,scope=router
          cache-to: type=gha,scope=router,mode=max
      - name: Build ui image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
