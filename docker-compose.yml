name: ai-gateway

services:
  # Go router: OpenAI-compatible API, provider fallback, usage tracking.
  # Sole owner of the SQLite database.
  router:
    # Prebuilt multi-arch image from GHCR; `docker compose up -d --build` builds from source instead.
    image: ghcr.io/ryancaudill04/ai-gateway-router:${IMAGE_TAG:-stable}
    build: ./router
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_ADDR: ":8080"
      # Admin API for `docker compose exec router /router providers ...`. Loopback only,
      # inside this container; never publish or expose it (it has no authentication).
      ADMIN_ADDR: "127.0.0.1:8081"
      DATABASE_PATH: /data/gateway.db
      PROVIDERS_CONFIG: /config/providers.yaml
    volumes:
      - router-data:/data
      - ./config:/config:ro
    expose:
      - "8080"
    # The image has no shell/curl, so the router binary checks its own /healthz
    healthcheck:
      test: ["CMD", "/router", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # React chat UI, built to static files and served by nginx.
  # Talks only to the router's API, never to providers or the database.
  ui:
    image: ghcr.io/ryancaudill04/ai-gateway-ui:${IMAGE_TAG:-stable}
    build: ./ui
    restart: unless-stopped
    expose:
      - "80"

  # Single entry point: /v1/* and /api/* → router, everything else → ui.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      router:
        condition: service_healthy
      ui:
        condition: service_started

  # Optional: expose the gateway through a Cloudflare Tunnel (no open ports).
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy

  # Optional: local models for the `private` route. Never exposed outside the compose network.
  #   docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # Optional: pulls new router/ui images and applies them, rolling back if the router
  # doesn't become healthy. Off by default.  docker compose --profile autoupdate up -d
  # See "Automatic updates" in the README. Mounting docker.sock is root-equivalent on the host.
  #
  # Path trick: the updater runs `docker compose` against the *host's* Docker daemon, and the
  # daemon resolves relative bind mounts (./config, ./proxy/Caddyfile) as host paths. So the
  # project directory is mounted at the SAME absolute path inside the updater (GATEWAY_DIR,
  # defaulting to the directory you ran compose from) and the project name is fixed to
  # `ai-gateway`; its compose commands then produce identical mounts and target the same containers.
  updater:
    image: docker:29-cli
    profiles: ["autoupdate"]
    restart: unless-stopped
    entrypoint: ["sh", "/updater/update.sh"]
    working_dir: ${GATEWAY_DIR:-${PWD}}
    environment:
      GATEWAY_DIR: ${GATEWAY_DIR:-${PWD}}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-}
      IMAGE_TAG: ${IMAGE_TAG:-stable}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GATEWAY_DIR:-${PWD}}:${GATEWAY_DIR:-${PWD}}
      - ./updater/update.sh:/updater/update.sh:ro

volumes:
  router-data:
  ollama-models:
