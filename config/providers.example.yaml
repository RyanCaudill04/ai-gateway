# Copy to config/providers.yaml and edit. API keys are NOT stored here —
# each provider names the environment variable that holds its key (see .env.example).
#
# DRAFT: the router doesn't read this yet, and the shape may change.
# Model IDs change often. Check each provider's model list before using these.

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models:
      - id: llama-3.3-70b-versatile
        context_length: 131072

  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    models:
      - id: llama-3.3-70b
        context_length: 65536

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    models:
      - id: gemini-2.5-flash
        context_length: 1048576

  ollama:
    base_url: ${OLLAMA_BASE_URL}/v1
    local: true # only these may serve the `private` route
    models:
      - id: llama3.2:3b
        context_length: 131072

# Virtual models: what clients ask for by name. Tried in order; on 429/5xx, go to the next.
routes:
  fast:
    - groq/llama-3.3-70b-versatile
    - cerebras/llama-3.3-70b
    - ollama/llama3.2:3b
  long-context:
    - gemini/gemini-2.5-flash
    - groq/llama-3.3-70b-versatile
  private:
    - ollama/llama3.2:3b
